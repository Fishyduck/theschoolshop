<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - The School Shop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="products-page">
<header>
  <div class="header-container">
    <h1>The School Shop</h1>

    <!-- ✅ Updated Navigation Bar -->
    <nav>
      <ul class="nav-bar">
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="products.html" class="active"><i class="fas fa-shopping-bag"></i> Products</a></li>
        <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a></li>
      </ul>
    </nav>

    <!-- ✅ Shop Status Section -->
    <section id="status-section">
      <span id="shop-status">Loading...</span>
    </section>
  </div>
</header>

<main>
  <h2>Our Products</h2>
  <div id="products" class="product-list"></div>

  <!-- ✅ Cart Button Placeholder -->
  <div id="cart-button-container">
    <button id="go-to-cart">
      <i class="fas fa-shopping-cart"></i> Go to Cart (0)
    </button>
  </div>
</main>

<footer>
  <p>&copy; <span id="current-year"></span> The School Shop. All rights reserved.</p>
</footer>

<!-- ✅ Ensure JavaScript Link -->
<script src="config.js"></script>
<script src="script.js"></script>
<script>
  // Set current year in footer
  document.getElementById('current-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
