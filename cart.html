<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - The School Shop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header>
  <div class="header-container">
    <h1>The School Shop</h1>

    <!-- ✅ Updated Navigation Bar -->
    <nav>
      <ul class="nav-bar">
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="products.html"><i class="fas fa-shopping-bag"></i> Products</a></li>
        <li><a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i> Cart</a></li>
      </ul>
    </nav>

    <!-- ✅ Shop Status Section -->
    <section id="status-section">
      <span id="shop-status">Loading...</span>
    </section>
  </div>
</header>

<main class="container">
  <div class="cart-page">
    <div class="page-title">
      <h1>Your Cart</h1>
      <p class="breadcrumbs">
        <a href="index.html">Home</a> / 
        <span>Cart</span>
      </p>
    </div>
    
    <div class="cart-container">
      <div class="cart-items-container">
        <div id="cart-items">
          <!-- Cart items will be loaded here -->
        </div>
        
        <!-- Move total here for better visibility -->
        <div id="cart-total">
          <span class="total-label">Total:</span>
          <span class="total-amount">$0.00</span>
        </div>
        
        <div class="cart-actions">
          <a href="products.html" class="btn btn-outline">
            <i class="fas fa-arrow-left"></i> Continue Shopping
          </a>
          <button id="update-cart" class="btn btn-secondary">
            <i class="fas fa-sync-alt"></i> Update Cart
          </button>
        </div>
      </div>
      
      <!-- Checkout Form -->
      <div class="checkout-form-container">
        <h3>Delivery Details</h3>
        <form id="checkout-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required>
          </div>
          
          <div class="form-group">
            <label>Location</label>
            <div class="location-options">
              <button type="button" class="location-option" data-location="Upper Lot Entrance Benches">
                <img src="images/location-a.png" alt="Upper Lot Entrance">
                <span>Upper Lot Entrance Benches</span>
              </button>
              <button type="button" class="location-option" data-location="Library Front Benches">
                <img src="images/location-b.png" alt="Library Front Benches">
                <span>Library Front Benches</span>
              </button>
              <button type="button" class="location-option" data-location="Up Stairs Between Lower-Upper Lot">
                <img src="images/location-c.png" alt="Up Stairs Between Lower-Upper Lot">
                <span>Up Stairs Between Lower-Upper Lot</span>
              </button>
            </div>
          </div>
          
          <div class="form-group">
            <label for="time-options">Time</label>
            <div id="time-options" class="time-options-container"></div>
          </div>
          
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          
          <button type="submit" id="checkout-button" class="btn btn-primary btn-block">
            <i class="fas fa-lock"></i> Proceed to Checkout
          </button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>&copy; <span id="current-year"></span> The School Shop. All rights reserved.</p>
</footer>

<!-- ✅ Ensure JavaScript Link -->
<script src="config.js"></script>
<script src="script.js"></script>
<script>
  // Set current year in footer
  document.getElementById('current-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
